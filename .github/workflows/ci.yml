# Three jobs:
#   test  — the sibling-free units (stripJsonc, the CAPABILITIES.md parser,
#           deployApp validation, the BENIGN console filter) on a bare
#           checkout; proves the server degrades cleanly with nothing around.
#   audit — `npm audit` on the two runtime dependencies, separately so an
#           advisory published overnight does not read as a failing test.
#   smoke — the same suite in a sibling workspace (samples-controls, linter,
#           abap2UI5, app-template and docs cloned next to this checkout), so
#           the stdio smoke actually runs: MCP handshake, a live CAPABILITIES.md
#           query, an `examples` search over the committed catalogue,
#           validate_view through the linter's public exports, and the guide /
#           client-API / docs parsers against the real upstream files. This is
#           the job that catches a sibling drifting away from what this server
#           consumes.
#
# What neither job covers, and should be said rather than assumed: run_app,
# build_backend and the render half of validate_view. They need the corpus'
# own npm install and a Chromium, which is minutes of setup for a check that
# would then take tens of minutes to transpile. The screenshot loop - half of
# what this server is for - is therefore verified by hand today.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  # A job of its own rather than a step in `test`: an advisory published
  # overnight is not a defect in this tree, and a red check that says `audit`
  # tells you that without reading a log. High and above only - this package
  # has two dependencies and neither is transitive-heavy.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm audit --audit-level=high

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcp-server
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # the siblings this server orchestrates — tip of main, exactly what a
      # user following the README ends up with. The linter's property gate is
      # dependency-free at import time, so a bare clone suffices.
      # samples-controls was called ai-demokit until it was renamed; cloning
      # the old name worked only through GitHub's redirect, which is not a
      # thing to depend on.
      - run: git clone --depth 1 https://github.com/abap2UI5/samples-controls
      - run: git clone --depth 1 https://github.com/abap2UI5/linter
      # the framework checkout. Four tools (app_guide, api_reference, pitfalls)
      # and five resources read it, and they are the most fragile consumers on
      # the compatibility surface: lib/api.mjs is a line parser over
      # abaplint-formatted ABAP (a formatting change upstream is a parser change
      # here) and lib/guide.mjs hard-codes docs/agents/building-apps.md. Without
      # this clone everything behind HAVE_A2UI5 in the smoke skipped itself, so
      # a rename or a reformat upstream reached a user before it reached CI.
      - run: git clone --depth 1 https://github.com/abap2UI5/abap2UI5
      # app-template is a sibling this server reads too - scaffold_app serves
      # its files and executes its template.json. Without the clone the three
      # scaffold tests skip themselves, and a smoke job that silently covers
      # less than it appears to is worse than one that fails.
      - run: git clone --depth 1 https://github.com/abap2UI5/app-template
      # the documentation site's sources - docs_search reads them, and its
      # smoke assertions only run when the checkout is there
      - run: git clone --depth 1 https://github.com/abap2UI5/docs
      - run: npm ci
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server

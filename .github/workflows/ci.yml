# Two jobs:
#   test  — the sibling-free units (stripJsonc, the CAPABILITIES.md parser,
#           deployApp validation, the BENIGN console filter) on a bare
#           checkout; proves the server degrades cleanly with nothing around.
#   smoke — the same suite in a sibling workspace (samples-controls + linter cloned
#           next to this checkout), so the stdio smoke actually runs: MCP
#           handshake, a live CAPABILITIES.md query, and validate_view through
#           the linter's public exports. This is the job that catches a
#           sibling drifting away from what this server consumes.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: mcp-server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # the siblings this server orchestrates — tip of main, exactly what a
      # user following the README ends up with. The linter's property gate is
      # dependency-free at import time, so a bare clone suffices.
      - run: git clone --depth 1 https://github.com/abap2UI5/samples-controls
      - run: git clone --depth 1 https://github.com/abap2UI5/linter
      - run: npm ci
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server

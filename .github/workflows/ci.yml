# Three jobs:
#   test  — the sibling-free units (stripJsonc, the CAPABILITIES.md parser,
#           deployApp validation, the BENIGN console filter) on a bare
#           checkout; proves the server degrades cleanly with nothing around.
#           First, as a step of its own, the server.json gate: the MCP
#           Registry listing has to carry package.json's version, name and
#           mcpName, or the registry publish fails after the npm one.
#   audit — `npm audit` on the two runtime dependencies, separately so an
#           advisory published overnight does not read as a failing test.
#   smoke — the same suite in a sibling workspace (samples-controls, linter,
#           abap2UI5, app-template and docs cloned next to this checkout), so
#           the stdio smoke actually runs: MCP handshake, a live CAPABILITIES.md
#           query, an `examples` search over the committed catalogue,
#           validate_view through the linter's public exports, and the guide /
#           client-API / docs parsers against the real upstream files. This is
#           the job that catches a sibling drifting away from what this server
#           consumes.
#
# The backend half of the expensive loop IS covered, by `npm test` under
# A2UI5_MCP_NETWORK_TESTS=1 (set for both jobs; the registry tests are opt-in
# so a local run stays fast): test/npm-integration.test.mjs installs
# @abap2ui5/node-runtime from the registry and runs deploy, build, unit tests,
# boot and an HTTP roundtrip (about 30 s; it skips itself without registry or
# GitHub access), and test/agent-integration.test.mjs operates an app through
# the app_* tools on the same published package, behind the same gate. What
# neither job covers, and should be said rather than assumed: the BROWSER half
# of run_app/interact_app and the render half of validate_view. They need UI5
# (the CDN, or a corpus' @openui5 packages) and a Chromium; the screenshot
# loop - half of what this server is for - is therefore verified by hand.
#
#   browser — the tests the other two jobs SKIP for want of a Chromium or a
#           protocol checkout: test/interact-browser.test.mjs (the four
#           page actions in a real page), test/mcp-app.test.mjs (the MCP Apps
#           page in Chromium under the default CSP) and test/vendor.test.mjs
#           (the vendored renderer regenerated from the protocol commit its
#           source.json records). Playwright's Chromium is installed, the
#           protocol commit is fetched by its sha, and the job fails when any
#           of the three files still skips a test - a job that silently
#           covers nothing would be worse than none.
name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:server-json
      - run: npm test
        env:
          A2UI5_MCP_NETWORK_TESTS: '1'

  # A job of its own rather than a step in `test`: an advisory published
  # overnight is not a defect in this tree, and a red check that says `audit`
  # tells you that without reading a log. High and above only - this package
  # has two dependencies and neither is transitive-heavy.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm audit --audit-level=high

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcp-server
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # the siblings this server orchestrates — tip of main, exactly what a
      # user following the README ends up with. The linter's property gate is
      # dependency-free at import time, so a bare clone suffices.
      # samples-controls was called ai-demokit until it was renamed; cloning
      # the old name worked only through GitHub's redirect, which is not a
      # thing to depend on.
      - run: git clone --depth 1 https://github.com/abap2UI5/samples-controls
      - run: git clone --depth 1 https://github.com/abap2UI5/linter
      # the framework checkout. Three tools (app_guide, api_reference, pitfalls)
      # and five resources read it, and they are the most fragile consumers on
      # the compatibility surface: lib/api.mjs is a line parser over
      # abaplint-formatted ABAP (a formatting change upstream is a parser change
      # here) and lib/guide.mjs hard-codes docs/agents/building-apps.md. Without
      # this clone everything behind HAVE_A2UI5 in the smoke skipped itself, so
      # a rename or a reformat upstream reached a user before it reached CI.
      - run: git clone --depth 1 https://github.com/abap2UI5/abap2UI5
      # app-template is a sibling this server reads too - scaffold_app serves
      # its files and executes its template.json, add_agent_setup executes its
      # agentSetup key. Without the clone the three scaffold tests and the
      # agent-setup parity test (against the template's create/agent-setup.mjs)
      # skip themselves, and a smoke job that silently covers less than it
      # appears to is worse than one that fails.
      - run: git clone --depth 1 https://github.com/abap2UI5/app-template
      # the documentation site's sources - docs_search reads them, and its
      # smoke assertions only run when the checkout is there
      - run: git clone --depth 1 https://github.com/abap2UI5/docs
      - run: npm ci
        working-directory: mcp-server
      - run: npm test
        working-directory: mcp-server
        env:
          A2UI5_MCP_NETWORK_TESTS: '1'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mcp-server
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci
        working-directory: mcp-server
      - name: Get Playwright version
        id: playwright-version
        working-directory: mcp-server
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: mcp-server
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: mcp-server
        run: npx playwright install-deps chromium
      # the commit lib/vendor/adaptive-cards/source.json records, fetched by
      # its sha (it need not be on protocol's main - a squash merge leaves the
      # commit only on its pull request's ref, which GitHub still serves)
      - name: Fetch the protocol commit the vendored renderer was made from
        run: |
          set -euo pipefail
          COMMIT=$(node -p "require('./mcp-server/lib/vendor/adaptive-cards/source.json').commit")
          git init -q protocol
          git -C protocol remote add origin https://github.com/abap2UI5/protocol
          git -C protocol fetch -q --depth 1 origin "$COMMIT"
          git -C protocol cat-file -e "$COMMIT^{commit}"
          echo "protocol at $COMMIT"
      - name: The browser and vendor tests run, and none of them skips
        working-directory: mcp-server
        env:
          PROTOCOL_HOME: ${{ github.workspace }}/protocol
        run: |
          set -euo pipefail
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=/tmp/browser.tap \
            test/interact-browser.test.mjs test/mcp-app.test.mjs test/vendor.test.mjs
          if ! grep -q '^# skipped 0$' /tmp/browser.tap; then
            grep -E '# SKIP|^# skipped' /tmp/browser.tap >&2 || true
            echo "a browser or vendor test skipped itself - the job exists so that none does" >&2
            exit 1
          fi
